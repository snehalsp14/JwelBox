<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Jewel Box</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="loginSignup.css">

    <script src="https://kit.fontawesome.com/8d66df2e6f.js"
        crossorigin="anonymous">
    </script>

</head>

<body>

    <div class="login-page">

        <!-- Logo -->

        <div class="login-logo">

            <img src="images/Jewelbox Collection Logo.png"
                 alt="Jewelbox Collection">

        </div>


        <!-- Signup Form -->

        <section class="auth-container">

            <div class="auth-box">

                <h2>Create Account</h2>


                <form action="index.html">

                    <input
                        type="text"
                        placeholder="Full Name"
                        required
                    >


                    <input
                        type="email"
                        placeholder="Email"
                        required
                    >


                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >


                    <input
                        type="password"
                        placeholder="Confirm Password"
                        required
                    >


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </section>

    </div>

</body>

</html>
