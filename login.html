    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="loginSignup.css">
    <script src="https://kit.fontawesome.com/8d66df2e6f.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="login-page">

        <!-- Logo -->
        <div class="login-logo">
            <img src="images/Jewelbox Collection Logo.png"
                 alt="Jewelbox Collection">
        </div>

        <!-- Login Form -->
        <section class="auth-container">

            <div class="auth-box">

                <h2>Login to Jewel Box</h2>

                <form action="" onsubmit="loginUser(event)">

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p id="loginMessage"></p>

                <br>

                <a href="#">Forgot Password</a>

                <p>
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>

        </section>

    </div>

</body>
<script>

function loginUser(event) {

    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    // Fixed username and password
    let correctUsername = "admin";
    let correctPassword = "12345";

    if (username === correctUsername && password === correctPassword) {

        // Login successful
        window.location.href = "index.html";

    } else {

        // Login failed
        document.getElementById("loginMessage").innerText =
            "Invalid username or password";

    }
}

</script>

</html>
    
</body>
</html>
